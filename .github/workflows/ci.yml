name: Amino Orbit checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax checks
        run: |
          php -l amino-orbit.php
          php -l includes/class-amino-orbit.php
          php -l uninstall.php
      - name: PHP isolated smoke checks
        run: php tests/smoke.php
      - name: Daily cleanup regression tests
        run: php tests/cleanup.php
      - name: AJAX authorization and privacy regression tests
        run: php tests/ajax-security.php
      - name: Compiled translation catalog tests
        run: python3 tests/i18n.py
      - name: JavaScript syntax check
        run: node --check assets/admin.js

  wordpress-integration:
    name: Real WordPress integration (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: orbit_ci
          MYSQL_USER: orbit_ci
          MYSQL_PASSWORD: orbit_ci_password
          MYSQL_ROOT_PASSWORD: orbit_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -porbit_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ROOT: /tmp/orbit-wp
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP and WordPress CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
          tools: wp-cli
      - name: Install disposable WordPress and the plugin
        run: |
          set -euo pipefail
          wp core download --path="$WP_ROOT" --skip-content --quiet
          wp config create --path="$WP_ROOT" --dbname=orbit_ci --dbuser=orbit_ci --dbpass=orbit_ci_password --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title="Amino Orbit CI" --admin_user=orbit_ci_admin --admin_password="temporary-ci-password-not-reused" --admin_email=admin@orbit-ci.invalid --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/amino-orbit"
          cp amino-orbit.php uninstall.php readme.txt README.md LICENSE "$WP_ROOT/wp-content/plugins/amino-orbit/"
          cp -R assets includes languages "$WP_ROOT/wp-content/plugins/amino-orbit/"
          wp plugin activate amino-orbit --path="$WP_ROOT"
          wp language core install fr_FR es_ES --path="$WP_ROOT"
      - name: Real WordPress session, authorization and translation checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-integration.php" --path="$WP_ROOT"

      - name: Install Chromium and accessibility audit tools
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
      - name: Browser AJAX, idle, keyboard and WCAG integration
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t "$WP_ROOT" > /tmp/orbit-php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -n 35 /tmp/orbit-php-server.log || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8080/wp-login.php > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser-e2e.cjs
      - name: Scale and bounded-query benchmarks (disposable database)
        run: wp eval-file "$GITHUB_WORKSPACE/tests/scaling.php" --path="$WP_ROOT"
      - name: Official WordPress Plugin Check (static and runtime)
        run: |
          set -euo pipefail
          wp plugin install plugin-check --activate --path="$WP_ROOT"
          set +e
          wp plugin check amino-orbit --format=json --path="$WP_ROOT" > /tmp/orbit-pcp-static.json 2>/tmp/orbit-pcp-static.err
          STATIC_EXIT=$?
          wp plugin check amino-orbit --format=json --require="$WP_ROOT/wp-content/plugins/plugin-check/cli.php" --path="$WP_ROOT" > /tmp/orbit-pcp-runtime.json 2>/tmp/orbit-pcp-runtime.err
          RUNTIME_EXIT=$?
          set -e
          echo "PLUGIN CHECK STATIC EXIT: $STATIC_EXIT"
          cat /tmp/orbit-pcp-static.err || true
          cat /tmp/orbit-pcp-static.json
          echo "PLUGIN CHECK RUNTIME EXIT: $RUNTIME_EXIT"
          cat /tmp/orbit-pcp-runtime.err || true
          cat /tmp/orbit-pcp-runtime.json
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          # PCP 2.2.0 emits FILE: headings and one JSON array per source file,
          # not one top-level JSON document. Parse every file section.
          errors = 0
          for kind in ("static", "runtime"):
              raw = pathlib.Path(f"/tmp/orbit-pcp-{kind}.json").read_text(encoding="utf-8")
              findings = []
              sections = 0
              for line in raw.splitlines():
                  line = line.strip()
                  if line.startswith("["):
                      rows = json.loads(line)
                      if not isinstance(rows, list):
                          raise RuntimeError(f"Expected PCP array for {kind}")
                      findings.extend(rows)
                      sections += 1
              if "FILE:" in raw and sections == 0:
                  raise RuntimeError(f"No machine-readable PCP findings could be parsed for {kind}")
              counts = {"ERROR": 0, "WARNING": 0}
              for result in findings:
                  severity = str(result.get("type", "")).upper()
                  counts[severity] = counts.get(severity, 0) + 1
                  print(f"PCP {kind}: {severity} {result.get('code')} line {result.get('line')}")
              errors += counts["ERROR"]
              print(f"PCP {kind}: {len(findings)} findings, {counts['ERROR']} errors and {counts['WARNING']} warnings across {sections} file sections")
          if errors:
              sys.exit(f"Plugin Check found {errors} error(s) across static/runtime checks")
          PY
      - name: Upload Plugin Check JSON findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amino-orbit-plugin-check-json
          path: /tmp/orbit-pcp-*.json
          if-no-files-found: ignore
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amino-orbit-browser-qa-failure
          path: /tmp/orbit-browser-failure.png
          if-no-files-found: ignore

