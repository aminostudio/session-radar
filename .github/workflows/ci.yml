name: SessiVue checks

on:
  # Run on main merges and PR updates, not twice for every feature push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Replace obsolete in-progress checks when the same PR receives new commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - name: Compile bundled FR/ES catalogs from PO
        run: python3 scripts/build-i18n.py
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax checks
        run: |
          php -l sessivue.php
          php -l includes/class-amino-orbit.php
          php -l uninstall.php
      - name: PHP isolated smoke checks
        run: php tests/smoke.php
      - name: Public slug upgrade migration regression tests
        run: php tests/migration.php
      - name: Daily cleanup regression tests
        run: php tests/cleanup.php
      - name: AJAX authorization and privacy regression tests
        run: php tests/ajax-security.php
      - name: Site opt-in and policy guide regression tests
        run: php tests/privacy.php
      - name: Personal data export and erasure regression tests
        run: php tests/privacy-data.php
      - name: Two-site shared-usermeta privacy isolation regression
        run: php tests/multisite-presence.php
      - name: Compiled translation catalog tests
        run: python3 tests/i18n.py
      - name: JavaScript syntax check
        run: node --check assets/admin.js
      - name: WordPress.org structural release preflight
        run: python3 tests/release-preflight.py

  wordpress-integration:
    name: Real WordPress integration (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: orbit_ci
          MYSQL_USER: orbit_ci
          MYSQL_PASSWORD: orbit_ci_password
          MYSQL_ROOT_PASSWORD: orbit_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -porbit_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ROOT: /tmp/orbit-wp
    steps:
      - uses: actions/checkout@v5
      - name: Compile bundled FR/ES catalogs from PO
        run: python3 scripts/build-i18n.py
      - name: Set up PHP and WordPress CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
          tools: wp-cli
      - name: Ensure WP-CLI is available (setup-php fallback)
        run: |
          set -euo pipefail
          if ! command -v wp >/dev/null 2>&1; then
            echo "::warning::setup-php did not install WP-CLI; using official wp-cli.phar fallback"
            mkdir -p "$HOME/.local/bin"
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 \
              https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
              -o "$HOME/.local/bin/wp-cli.phar"
            php "$HOME/.local/bin/wp-cli.phar" --info
            # Replace HOME at generation time so a POSIX shell resolves it reliably.
            printf '#!/bin/sh\nexec php "%s/.local/bin/wp-cli.phar" "$@"\n' "$HOME" > "$HOME/.local/bin/wp"
            chmod +x "$HOME/.local/bin/wp"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          wp --info
      - name: Install disposable WordPress and the plugin
        run: |
          set -euo pipefail
          wp core download --path="$WP_ROOT" --skip-content --quiet
          wp config create --path="$WP_ROOT" --dbname=orbit_ci --dbuser=orbit_ci --dbpass=orbit_ci_password --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title="SessiVue CI" --admin_user=orbit_ci_admin --admin_password="temporary-ci-password-not-reused" --admin_email=admin@orbit-ci.invalid --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/sessivue"
          cp sessivue.php uninstall.php readme.txt README.md LICENSE "$WP_ROOT/wp-content/plugins/sessivue/"
          cp -R assets includes languages "$WP_ROOT/wp-content/plugins/sessivue/"
          wp plugin activate sessivue --path="$WP_ROOT"
          wp language core install fr_FR es_ES --path="$WP_ROOT"
          # Reproduce WordPress.org language-pack delivery for the unapproved slug.
          # The current plugin package intentionally contains no bundled MO files.
          mkdir -p "$WP_ROOT/wp-content/languages/plugins"
          cp languages/sessivue-fr_FR.mo "$WP_ROOT/wp-content/languages/plugins/"
          cp languages/sessivue-es_ES.mo "$WP_ROOT/wp-content/languages/plugins/"
      - name: Real WordPress session, authorization and translation checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-integration.php" --path="$WP_ROOT"

      - name: Install Chromium and accessibility audit tools
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
      - name: Browser AJAX, idle, keyboard and WCAG integration
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t "$WP_ROOT" > /tmp/orbit-php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -n 35 /tmp/orbit-php-server.log || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8080/wp-login.php > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser-e2e.cjs
      - name: Concurrent authenticated AJAX polling (eight administrators)
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/concurrent-fixture.php" --path="$WP_ROOT"
          # Eight worker processes are essential. A single-worker PHP -S
          # would serialize requests and invalidate the concurrency probe.
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t "$WP_ROOT" > /tmp/orbit-concurrent-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -n 20 /tmp/orbit-concurrent-server.log || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8080/wp-login.php > /dev/null; then break; fi
            sleep 1
          done
          node tests/concurrent-ajax.cjs
      - name: Scale and bounded-query benchmarks (disposable database)
        run: wp eval-file "$GITHUB_WORKSPACE/tests/scaling.php" --path="$WP_ROOT"
      - name: Official WordPress Plugin Check (static and runtime)
        run: |
          set -euo pipefail
          wp plugin install plugin-check --activate --path="$WP_ROOT"
          set +e
          wp plugin check sessivue --format=json --path="$WP_ROOT" > /tmp/orbit-pcp-static.json 2>/tmp/orbit-pcp-static.err
          STATIC_EXIT=$?
          wp plugin check sessivue --format=json --require="$WP_ROOT/wp-content/plugins/plugin-check/cli.php" --path="$WP_ROOT" > /tmp/orbit-pcp-runtime.json 2>/tmp/orbit-pcp-runtime.err
          RUNTIME_EXIT=$?
          set -e
          echo "PLUGIN CHECK STATIC EXIT: $STATIC_EXIT"
          cat /tmp/orbit-pcp-static.err || true
          cat /tmp/orbit-pcp-static.json
          echo "PLUGIN CHECK RUNTIME EXIT: $RUNTIME_EXIT"
          cat /tmp/orbit-pcp-runtime.err || true
          cat /tmp/orbit-pcp-runtime.json
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          # PCP 2.2.0 emits FILE: headings and one JSON array per source file,
          # not one top-level JSON document. Parse every file section.
          errors = 0
          for kind in ("static", "runtime"):
              raw = pathlib.Path(f"/tmp/orbit-pcp-{kind}.json").read_text(encoding="utf-8")
              findings = []
              sections = 0
              for line in raw.splitlines():
                  line = line.strip()
                  if line.startswith("["):
                      rows = json.loads(line)
                      if not isinstance(rows, list):
                          raise RuntimeError(f"Expected PCP array for {kind}")
                      findings.extend(rows)
                      sections += 1
              if "FILE:" in raw and sections == 0:
                  raise RuntimeError(f"No machine-readable PCP findings could be parsed for {kind}")
              counts = {"ERROR": 0, "WARNING": 0}
              for result in findings:
                  severity = str(result.get("type", "")).upper()
                  counts[severity] = counts.get(severity, 0) + 1
                  print(f"PCP {kind}: {severity} {result.get('code')} line {result.get('line')}")
              errors += counts["ERROR"]
              print(f"PCP {kind}: {len(findings)} findings, {counts['ERROR']} errors and {counts['WARNING']} warnings across {sections} file sections")
          if errors:
              sys.exit(f"Plugin Check found {errors} error(s) across static/runtime checks")
          PY
      - name: Assemble private installable candidate ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/orbit-release/sessivue
          cp sessivue.php uninstall.php readme.txt README.md LICENSE /tmp/orbit-release/sessivue/
          cp -R assets includes /tmp/orbit-release/sessivue/
          # WordPress.org distributes translated language packs separately.
          # Keep PO sources in Git only, not in the reviewer ZIP.
          VERSION=$(sed -n 's/^ \* Version: //p' sessivue.php | head -n 1)
          test -n "$VERSION"
          test "$(sed -n 's/^Stable tag: //p' readme.txt | head -n 1)" = "$VERSION"
          (cd /tmp/orbit-release && zip -qr "$GITHUB_WORKSPACE/sessivue-${VERSION}.zip" sessivue)
      - name: Validate private ZIP structure and bundled versions
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^ \* Version: //p' sessivue.php | head -n 1)
          python3 tests/release-preflight.py "sessivue-${VERSION}.zip"
      - name: Upload private WordPress install candidate
        uses: actions/upload-artifact@v4
        with:
          name: sessivue-private-zip
          path: sessivue-*.zip
          if-no-files-found: error
      - name: Upload Plugin Check JSON findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sessivue-plugin-check-json
          path: /tmp/orbit-pcp-*.json
          if-no-files-found: ignore
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sessivue-browser-qa-failure
          path: /tmp/orbit-browser-failure.png
          if-no-files-found: ignore


  wordpress-minimum:
    name: WordPress 6.4 + PHP 8.0 minimum compatibility
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: orbit_min
          MYSQL_USER: orbit_min
          MYSQL_PASSWORD: orbit_min_password
          MYSQL_ROOT_PASSWORD: orbit_min_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -porbit_min_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ROOT: /tmp/orbit-wp-minimum
    steps:
      - uses: actions/checkout@v5
      - name: Compile bundled FR/ES catalogs from PO
        run: python3 scripts/build-i18n.py
      - name: Set up minimum supported PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli
          coverage: none
          tools: wp-cli
      - name: Ensure WP-CLI is available (setup-php fallback)
        run: |
          set -euo pipefail
          if ! command -v wp >/dev/null 2>&1; then
            echo "::warning::setup-php did not install WP-CLI; using official wp-cli.phar fallback"
            mkdir -p "$HOME/.local/bin"
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 \
              https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
              -o "$HOME/.local/bin/wp-cli.phar"
            php "$HOME/.local/bin/wp-cli.phar" --info
            # Replace HOME at generation time so a POSIX shell resolves it reliably.
            printf '#!/bin/sh\nexec php "%s/.local/bin/wp-cli.phar" "$@"\n' "$HOME" > "$HOME/.local/bin/wp"
            chmod +x "$HOME/.local/bin/wp"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          wp --info
      - name: Install disposable WordPress 6.4 and SessiVue
        run: |
          set -euo pipefail
          wp core download --version=6.4 --path="$WP_ROOT" --skip-content --quiet
          wp config create --path="$WP_ROOT" --dbname=orbit_min --dbuser=orbit_min --dbpass=orbit_min_password --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title="SessiVue CI" --admin_user=orbit_ci_admin --admin_password="temporary-ci-password-not-reused" --admin_email=admin@orbit-ci.invalid --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/sessivue"
          cp sessivue.php uninstall.php readme.txt README.md LICENSE "$WP_ROOT/wp-content/plugins/sessivue/"
          cp -R assets includes languages "$WP_ROOT/wp-content/plugins/sessivue/"
          wp plugin activate sessivue --path="$WP_ROOT"
          wp language core install fr_FR es_ES --path="$WP_ROOT"
          # Reproduce WordPress.org language-pack delivery for the unapproved slug.
          # The current plugin package intentionally contains no bundled MO files.
          mkdir -p "$WP_ROOT/wp-content/languages/plugins"
          cp languages/sessivue-fr_FR.mo "$WP_ROOT/wp-content/languages/plugins/"
          cp languages/sessivue-es_ES.mo "$WP_ROOT/wp-content/languages/plugins/"
          wp core version --path="$WP_ROOT"
      - name: Native sessions, roles and logout on WordPress 6.4
        run: ORBIT_CHECK_LOCALE_IN_FRESH_BOOT=1 wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-integration.php" --path="$WP_ROOT"
      - name: Real bundled translations in fresh WordPress 6.4 bootstraps
        run: |
          set -euo pipefail
          wp option update WPLANG fr_FR --path="$WP_ROOT"
          ORBIT_MIN_TEST_LOCALE=fr_FR wp eval-file "$GITHUB_WORKSPACE/tests/minimum-locale.php" --path="$WP_ROOT"
          wp option update WPLANG es_ES --path="$WP_ROOT"
          ORBIT_MIN_TEST_LOCALE=es_ES wp eval-file "$GITHUB_WORKSPACE/tests/minimum-locale.php" --path="$WP_ROOT"
          wp option update WPLANG en_US --path="$WP_ROOT"


  wordpress-multisite:
    name: Real WordPress Multisite two-blog privacy (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sessivue_ms
          MYSQL_USER: sessivue_ms
          MYSQL_PASSWORD: sessivue_ms_password
          MYSQL_ROOT_PASSWORD: sessivue_ms_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -psessivue_ms_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ROOT: /tmp/sessivue-multisite
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP with WordPress CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
          tools: wp-cli
      - name: Ensure WP-CLI exists
        run: |
          set -euo pipefail
          if ! command -v wp >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            curl --fail --location --silent --show-error --retry 4 \
              https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
              -o "$HOME/.local/bin/wp-cli.phar"
            printf '#!/bin/sh\nexec php "%s/.local/bin/wp-cli.phar" "$@"\n' "$HOME" > "$HOME/.local/bin/wp"
            chmod +x "$HOME/.local/bin/wp"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          wp --info
      - name: Install isolated two-blog Multisite and network-activate SessiVue
        run: |
          set -euo pipefail
          wp core download --path="$WP_ROOT" --skip-content --quiet
          wp config create --path="$WP_ROOT" --dbname=sessivue_ms --dbuser=sessivue_ms \
            --dbpass=sessivue_ms_password --dbhost=127.0.0.1 --skip-check
          wp core multisite-install --path="$WP_ROOT" --url=http://sessivue.test \
            --title="SessiVue Multisite CI" --admin_user=orbit_ci_admin \
            --admin_password="temporary-ci-password-not-reused" \
            --admin_email=admin@sessivue.invalid --skip-email
          wp site create --path="$WP_ROOT" --slug=second --title="Second Blog"
          mkdir -p "$WP_ROOT/wp-content/plugins/sessivue"
          cp sessivue.php uninstall.php readme.txt README.md LICENSE "$WP_ROOT/wp-content/plugins/sessivue/"
          cp -R assets includes "$WP_ROOT/wp-content/plugins/sessivue/"
          wp plugin activate sessivue --network --path="$WP_ROOT"
          wp site list --path="$WP_ROOT"
      - name: Test real cross-blog presence and GDPR isolation
        run: wp eval-file "$GITHUB_WORKSPACE/tests/multisite-wordpress.php" --path="$WP_ROOT"
